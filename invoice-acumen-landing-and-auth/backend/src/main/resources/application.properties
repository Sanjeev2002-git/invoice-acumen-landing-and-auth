spring.application.name=invoice-acumen

# MySQL Database Config - configure through environment variables or a local .env loader.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/invoice_acumen?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:invoice_app}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080

# JWT Config - JWT_SECRET must be set outside local development.
jwt.secret=${JWT_SECRET:local-development-secret-change-before-deployment}
jwt.expiration.ms=${JWT_EXPIRATION_MS:86400000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Local storage for uploaded profile images
app.upload-dir=${APP_UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Keep startup output useful without exposing SQL or framework internals.
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.com.invoiceacumen=INFO

management.endpoints.web.exposure.include=health,info

# Mail (Brevo SMTP) - set real values via environment variables, never commit them.
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.admin-email=${ADMIN_EMAIL:admin@example.com}
app.cookie-secure=${COOKIE_SECURE:false}
