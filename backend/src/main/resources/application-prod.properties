# Production must provide explicit secrets and database credentials. Do not use Hibernate
# schema updates in production; replace the placeholder V1 migration with the full schema
# before activating this profile on a fresh database.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
jwt.secret=${JWT_SECRET}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}
logging.level.root=INFO
logging.level.com.invoiceacumen=INFO

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.admin-email=${ADMIN_EMAIL}
app.cookie-secure=${COOKIE_SECURE:true}
